<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Dheeksha Insurance | Vehicle Insurance & Claim Assistance in Peravurani</title>
    <meta name="description" content="Dheeksha Insurance is your trusted local partner for vehicle insurance, policy renewals, and end-to-end claim assistance in Peravurani, Thanjavur." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dheeksha Insurance | Vehicle Insurance & Claim Assistance" />
    <meta property="og:description" content="Dheeksha Insurance is your trusted local partner for vehicle insurance, policy renewals, and end-to-end claim assistance in Peravurani, Thanjavur." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dheeksha Insurance | Vehicle Insurance & Claim Assistance" />
    <!-- Prevent FOUC: Early theme and language application -->
    <script>
      (function() {
        try {
          var savedLang = localStorage.getItem('dheeksha-language');
          if (savedLang === 'ta' || savedLang === 'en') {
            document.documentElement.lang = savedLang;
            document.documentElement.setAttribute('data-language', savedLang);
          }
          var saved = localStorage.getItem('dheeksha-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
